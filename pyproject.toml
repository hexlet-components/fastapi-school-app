[project]
name = "fastapi-school-app"
version = "0.1.0"
description = "Учебное приложение на FastAPI: курсы и пользователи"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
