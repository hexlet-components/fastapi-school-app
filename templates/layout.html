<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Хекслет</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">Главная</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav justify-content-end">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('users') }}">Пользователи</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('courses') }}">Курсы</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container wrapper flex-grow-1">
      {% for message in flash_messages %}
        <div class="alert alert-{{ message.category }}">{{ message.text }}</div>
      {% endfor %}

      {% for error in errors | default([]) %}
        <div class="alert alert-warning">{{ error }}</div>
      {% endfor %}

      {% block header %}{% endblock %}
      {% block content %}{% endblock %}
    </div>

    <footer class="bg-dark text-light">
      <div class="container py-3">
        <p class="lead mb-0">&copy; Hexlet Ltd, 2026</p>
      </div>
    </footer>
  </body>
</html>
