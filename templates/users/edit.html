{% extends "layout.html" %}

{% block header %}
  <h1 class="mt-6 mb-4 text-3xl font-bold">Редактирование пользователя</h1>
{% endblock %}

{% block content %}
  <div
    class="mx-auto max-w-xl rounded-lg border border-gray-200 bg-white p-6 shadow-sm"
  >
    <form action="{{ url_for('update_user', user_id=user.id) }}" method="post">
      <input name="csrf_token" type="hidden" value="{{ csrf_token }}" />

      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium" for="name">Имя</label>
        <input
          class="w-full rounded border border-gray-300 px-3 py-2"
          id="name"
          name="name"
          value="{{ form.name }}"
        />
      </div>

      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium" for="email">Емейл</label>
        <input
          class="w-full rounded border border-gray-300 px-3 py-2"
          id="email"
          name="email"
          value="{{ form.email }}"
        />
      </div>

      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium" for="password">Пароль</label>
        <input
          class="w-full rounded border border-gray-300 px-3 py-2"
          id="password"
          name="password"
          type="password"
        />
      </div>

      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium" for="password_confirmation">Подтверждение пароля</label>
        <input
          class="w-full rounded border border-gray-300 px-3 py-2"
          id="password_confirmation"
          name="password_confirmation"
          type="password"
        />
      </div>

      <input
        class="cursor-pointer rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
        type="submit"
        value="Сохранить"
      />
    </form>
  </div>
{% endblock %}
