{% extends "layout.html" %}

{% block header %}
  <h1 class="display-4 fw-bold mt-4">Список пользователей</h1>
{% endblock %}

{% block content %}
  <a class="btn btn-primary mb-5" href="{{ url_for('new_user') }}">
    Новый пользователь
  </a>

  <div class="table-responsive">
    <table class="table table-borderless table-striped mt-5 bg-white">
      <thead>
        <tr>
          <th>Идентификатор</th>
          <th>Имя</th>
          <th>Емейл</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
          <tr>
            <td>{{ user.id }}</td>
            <td>
              <a href="{{ url_for('user', user_id=user.id) }}">{{ user.name }}</a>
            </td>
            <td>{{ user.email }}</td>
            <td>
              <div class="d-flex flex-wrap">
                <a
                  class="btn btn-primary me-1"
                  href="{{ url_for('edit_user', user_id=user.id) }}"
                >
                  Редактировать
                </a>
                <form
                  action="{{ url_for('delete_user', user_id=user.id) }}"
                  method="post"
                >
                  <input name="csrf_token" type="hidden" value="{{ csrf_token }}" />
                  <input class="btn btn-danger" type="submit" value="Удалить" />
                </form>
              </div>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
