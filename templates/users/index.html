{% extends "layout.html" %}

{% block header %}
  <h1 class="mt-6 mb-4 text-3xl font-bold">Список пользователей</h1>
{% endblock %}

{% block content %}
  <a
    class="inline-block rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
    href="{{ url_for('new_user') }}"
  >
    Новый пользователь
  </a>

  <div class="mt-8 overflow-x-auto">
    <table class="w-full border-collapse bg-white text-left">
      <thead>
        <tr class="border-b border-gray-200">
          <th class="px-4 py-2 font-semibold">Идентификатор</th>
          <th class="px-4 py-2 font-semibold">Имя</th>
          <th class="px-4 py-2 font-semibold">Емейл</th>
          <th class="px-4 py-2 font-semibold">Действия</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
          <tr class="border-b border-gray-100 odd:bg-gray-50">
            <td class="px-4 py-2">{{ user.id }}</td>
            <td class="px-4 py-2">
              <a
                class="text-blue-600 hover:underline"
                href="{{ url_for('user', user_id=user.id) }}">{{ user.name }}</a>
            </td>
            <td class="px-4 py-2">{{ user.email }}</td>
            <td class="px-4 py-2">
              <div class="flex flex-wrap items-center gap-2">
                <a
                  class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700"
                  href="{{ url_for('edit_user', user_id=user.id) }}"
                >
                  Редактировать
                </a>
                <form
                  action="{{ url_for('delete_user', user_id=user.id) }}"
                  method="post"
                >
                  <input name="csrf_token" type="hidden" value="{{ csrf_token }}" />
                  <input
                    class="cursor-pointer rounded bg-red-600 px-3 py-1 text-sm text-white hover:bg-red-700"
                    type="submit"
                    value="Удалить"
                  />
                </form>
              </div>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
