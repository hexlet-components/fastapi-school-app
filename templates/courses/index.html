{% extends "layout.html" %}

{% block header %}
  <h1 class="display-4 fw-bold mt-4">Список курсов</h1>
{% endblock %}

{% block content %}
  <a class="btn btn-primary mb-5" href="{{ url_for('new_course') }}">
    Новый курс
  </a>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form action="{{ url_for('courses') }}" method="get">
        <div class="row">
          <div class="col-12 col-md">
            <label for="title">Название курса</label>
            <input class="form-control" id="title" name="title" />
          </div>
        </div>
        <input class="btn btn-primary mt-3" type="submit" value="Поиск" />
      </form>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-borderless table-striped mt-5 bg-white">
      <thead>
        <tr>
          <th>Идентификатор</th>
          <th>Название</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
        {% for course in courses %}
          <tr>
            <td>{{ course.id }}</td>
            <td>
              <a href="{{ url_for('course', course_id=course.id) }}">
                {{ course.title }}
              </a>
            </td>
            <td>
              <div class="d-flex flex-wrap">
                <a
                  class="btn btn-primary me-1"
                  href="{{ url_for('edit_course', course_id=course.id) }}"
                >
                  Редактировать
                </a>
                <form
                  action="{{ url_for('delete_course', course_id=course.id) }}"
                  method="post"
                >
                  <input name="csrf_token" type="hidden" value="{{ csrf_token }}" />
                  <input class="btn btn-danger" type="submit" value="Удалить" />
                </form>
              </div>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
