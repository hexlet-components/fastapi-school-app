{% extends "layout.html" %}

{% block header %}
  <h1 class="mt-6 mb-4 text-3xl font-bold">Редактирование курса</h1>
{% endblock %}

{% block content %}
  <div
    class="mx-auto max-w-xl rounded-lg border border-gray-200 bg-white p-6 shadow-sm"
  >
    <form action="{{ url_for('update_course', course_id=course.id) }}" method="post">
      <input name="csrf_token" type="hidden" value="{{ csrf_token }}" />

      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium" for="title">Название</label>
        <input
          class="w-full rounded border border-gray-300 px-3 py-2"
          id="title"
          name="title"
          value="{{ form.title }}"
        />
      </div>

      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium" for="description">Описание</label>
        <textarea
          class="w-full rounded border border-gray-300 px-3 py-2"
          id="description"
          name="description"
          rows="4"
        >{{ form.description }}</textarea>
      </div>

      <input
        class="cursor-pointer rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
        type="submit"
        value="Сохранить"
      />
    </form>
  </div>
{% endblock %}
