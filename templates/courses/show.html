{% extends "layout.html" %}

{% block header %}
  <h1 class="mt-6 mb-4 text-3xl font-bold">{{ course.title }}</h1>
{% endblock %}

{% block content %}
  <div class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
    <dl>
      <div class="mb-3 flex flex-wrap gap-2">
        <dt class="text-gray-500">Название</dt>
        <dd>{{ course.title }}</dd>
      </div>
      <div class="mb-4 flex flex-wrap gap-2">
        <dt class="text-gray-500">Описание</dt>
        <dd>{{ course.description }}</dd>
      </div>
    </dl>
    <div class="flex flex-wrap items-center gap-2">
      <a
        class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
        href="{{ url_for('edit_course', course_id=course.id) }}"
      >
        Редактировать
      </a>
      <form action="{{ url_for('delete_course', course_id=course.id) }}" method="post">
        <input name="csrf_token" type="hidden" value="{{ csrf_token }}" />
        <input
          class="cursor-pointer rounded bg-red-600 px-4 py-2 text-white hover:bg-red-700"
          type="submit"
          value="Удалить"
        />
      </form>
    </div>
  </div>
{% endblock %}
