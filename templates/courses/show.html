{% extends "layout.html" %}

{% block content %}
  <div class="row mt-5 p-5 shadow bg-white">
    <div class="col-12 col-md-4 px-3">
      <div class="d-flex flex-wrap mb-3">
        <span class="text-muted me-2">Название</span>
        <span>{{ course.title }}</span>
      </div>
      <div class="d-flex flex-wrap mb-3">
        <span class="text-muted me-2">Описание</span>
        <span>{{ course.description }}</span>
      </div>
      <div class="d-flex flex-wrap">
        <a
          class="btn btn-primary me-1"
          href="{{ url_for('edit_course', course_id=course.id) }}"
        >
          Редактировать
        </a>
        <form
          action="{{ url_for('delete_course', course_id=course.id) }}"
          method="post"
        >
          <input name="csrf_token" type="hidden" value="{{ csrf_token }}" />
          <input class="btn btn-danger" type="submit" value="Удалить" />
        </form>
      </div>
    </div>
  </div>
{% endblock %}
