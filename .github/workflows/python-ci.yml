name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # setup-python не нужен: версию питона держит .python-version, и uv сам
      # ставит её при первом `uv sync`.
      - uses: astral-sh/setup-uv@v10.0.1

      - uses: jdx/mise-action@v5

      - name: Install
        run: make install
      - name: Build css
        run: make build-css
      - name: Run linter
        run: make lint
      - name: Run tests
        run: make test
